# 1. Ollama (OpenAI-compatible)
spring.ai.openai.base-url=http://localhost:11434
spring.ai.openai.api-key=ollama

spring.ai.openai.chat.options.model=qwen2.5:3b
spring.ai.openai.embedding.options.model=nomic-embed-text
spring.ai.openai.embedding.options.dimensions=768

# 2. DashScope
spring.ai.dashscope.enabled=${DASHSCOPE_ENABLED:false}
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY:}
spring.ai.dashscope.chat.options.model=${DASHSCOPE_CHAT_MODEL:qwen-plus}
spring.ai.dashscope.agent.enabled=false
spring.ai.dashscope.embedding.enabled=false
spring.ai.dashscope.image.enabled=false
spring.ai.dashscope.rerank.enabled=false
spring.ai.dashscope.video.enabled=false

# 3. Phase 3 POC toggles
rag.chat.memory.serializer=legacy
rag.parser.provider=legacy

# 4. Milvus
spring.ai.vectorstore.milvus.client.host=YOUR_MILVUS_HOST
spring.ai.vectorstore.milvus.client.port=19530
spring.ai.vectorstore.milvus.embedding-dimension=768
spring.ai.vectorstore.milvus.collection-name=campus_knowledge_vector

# 5. MySQL
spring.datasource.url=jdbc:mysql://YOUR_MYSQL_HOST:3306/campus_knowledge?useSSL=false&characterEncoding=utf8
spring.datasource.username=YOUR_MYSQL_USER
spring.datasource.password=YOUR_MYSQL_PASSWORD

# 6. Redis
spring.data.redis.host=YOUR_REDIS_HOST
spring.data.redis.port=6379

# 7. RAG input
input.directory=YOUR_INPUT_DIRECTORY

# 8. OpenTelemetry (OTLP)
management.tracing.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
# For local Langfuse, set OTEL_EXPORTER_OTLP_AUTHORIZATION to "Basic <base64(public_key:secret_key)>".
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:3000/api/public/otel/v1/traces}
management.otlp.tracing.headers[Authorization]=${OTEL_EXPORTER_OTLP_AUTHORIZATION:}
management.otlp.tracing.headers[x-langfuse-ingestion-version]=4

# 9. jwt
security.jwt.secret=123456 

# Agent RAG
rag.agent.enable=true
rag.agent.max-steps=3
rag.agent.timeout-ms=12000
rag.agent.default-mode=rag
